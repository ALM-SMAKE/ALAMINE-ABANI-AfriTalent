<main>

<section class="text-center text-white d-flex align-items-center" style="height:50vh; background:#222;">
    <div class="container">
        <h1>Contactez-nous</h1>
        <p>Une question ? Un projet ? Écrivez-nous </p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="container">

        <h2 class="text-center mb-5">
            Contactez-nous
        </h2>

        <form id="contactForm">

            <div class="mb-3">

                <label class="form-label">
                    Nom
                </label>

                <input 
                    type="text"
                    class="form-control"
                    id="nom"
                >

                <small id="nomError" class="text-danger"></small>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Email
                </label>

                <input 
                    type="email"
                    class="form-control"
                    id="email"
                >

                <small id="emailError" class="text-danger"></small>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Sujet
                </label>

                <input 
                    type="text"
                    class="form-control"
                    id="sujet"
                >

                <small id="sujetError" class="text-danger"></small>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Message
                </label>

                <textarea 
                    class="form-control"
                    rows="5"
                    id="message"
                ></textarea>

                <small id="messageError" class="text-danger"></small>

            </div>

            <button type="submit" class="btn btn-primary">
                Envoyer
            </button>

            <p id="successMessage" class="text-success mt-3"></p>

        </form>

    </div>

            <div class="col-md-6">
